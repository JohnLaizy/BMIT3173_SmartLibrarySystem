<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Smart Library System icon</title>
  <desc id="description">An open book with a central room entrance and connected smart-system nodes.</desc>

  <defs>
    <linearGradient id="background" x1="80" y1="48" x2="432" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="0.52" stop-color="#3730A3"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="page" x1="140" y1="176" x2="372" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#172554" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- Rounded application tile -->
  <rect x="28" y="28" width="456" height="456" rx="116" fill="url(#background)"/>
  <rect x="42" y="42" width="428" height="428" rx="102" fill="none" stroke="#C7D2FE" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Smart connection nodes -->
  <g fill="none" stroke="#DBEAFE" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M178 154L256 112L334 154"/>
  </g>
  <circle cx="178" cy="154" r="18" fill="#FDE68A"/>
  <circle cx="256" cy="112" r="18" fill="#FDE68A"/>
  <circle cx="334" cy="154" r="18" fill="#FDE68A"/>

  <!-- Open book -->
  <g filter="url(#shadow)">
    <path
      d="M92 202C145 180 202 188 256 228V398C211 365 155 353 92 372V202Z"
      fill="url(#page)"
    />
    <path
      d="M420 202C367 180 310 188 256 228V398C301 365 357 353 420 372V202Z"
      fill="url(#page)"
    />
  </g>

  <!-- Page details -->
  <path d="M126 244C166 233 202 239 230 255" fill="none" stroke="#93C5FD" stroke-width="14" stroke-linecap="round"/>
  <path d="M126 292C166 281 202 287 230 303" fill="none" stroke="#93C5FD" stroke-width="14" stroke-linecap="round"/>
  <path d="M386 244C346 233 310 239 282 255" fill="none" stroke="#93C5FD" stroke-width="14" stroke-linecap="round"/>
  <path d="M386 292C346 281 310 287 282 303" fill="none" stroke="#93C5FD" stroke-width="14" stroke-linecap="round"/>

  <!-- Central room entrance -->
  <path
    d="M218 398V292C218 271 235 254 256 254C277 254 294 271 294 292V398"
    fill="#172554"
  />
  <path
    d="M236 398V298C236 287 245 278 256 278C267 278 276 287 276 298V398"
    fill="#FDE68A"
  />
  <circle cx="262" cy="339" r="6" fill="#172554"/>
</svg>
